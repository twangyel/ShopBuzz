<head>

  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BuzzCafe">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            domBlue: '#0078AC',
            domBlueDark: '#005a82',
            domBlueLight: '#E6F2F8',
            domRed: '#D2112C',
            domRedDark: '#A50D22',
            domRedLight: '#FDE8EB',
            domDark: '#1A1A1A',
            domGray: '#6B7280',
            domGrayLight: '#F3F4F6',
            domLine: '#E5E7EB',
            domGreen: '#16a34a',
            domGreenLight: '#dcfce7',
            domAmber: '#ca8a04',
            domAmberLight: '#fef9c3',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease-out forwards',
            'slide-up': 'slideUp 0.4s ease-out forwards',
            'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
            'shimmer': 'shimmer 1.5s infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            pulseSoft: {
              '0%, 100%': { opacity: '1', transform: 'scale(1)' },
              '50%': { opacity: '0.85', transform: 'scale(1.02)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            }
          }
        }
      }
    }

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: 'Inter', system-ui, sans-serif; 
      background: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== LOADER ===== */
    #loader {
      position: fixed; inset: 0; background: #fff; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-ring {
      width: 48px; height: 48px;
      border: 3px solid #E6F2F8;
      border-top-color: #0078AC;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-word { 
      margin-top: 16px; font-size: 18px; font-weight: 800; color: #1A1A1A; letter-spacing: -0.5px;
    }
    .loader-word span { color: #0078AC; }

    /* ===== SKELETON ===== */
    .skel {
      background: linear-gradient(90deg, #F3F4F6 25%, #E5E7EB 50%, #F3F4F6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 8px;
    }

    /* ===== OUTLET GRID — CENTERED LIKE ORIGINAL ===== */
       /* ===== OUTLET GRID — CENTERED LIKE ORIGINAL ===== */
    .outlet-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 20px;
      justify-items: center; /* centers cards horizontally in their grid cell */
    }
    @media (min-width: 640px) {
      .outlet-grid {
        grid-template-columns: repeat(auto-fit, minmax(280px, 420px));
        gap: 24px;
        justify-content: center; /* centers the tracks when fewer items than columns */
      }
    }
    @media (min-width: 1024px) {
      .outlet-grid {
        grid-template-columns: repeat(auto-fit, minmax(300px, 420px));
        gap: 28px;
        justify-content: center;
      }
    }

    /* ===== OUTLET CARD ===== */
    .outlet-card {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      background: #fff;
      width: 100%;
      max-width: 420px;
    }
    .outlet-card:not(.outlet-closed):hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -8px rgba(0,0,0,0.12), 0 4px 8px -4px rgba(0,0,0,0.06);
    }
    .outlet-card:not(.outlet-closed):hover .outlet-img {
      transform: scale(1.04);
    }
    .outlet-img {
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Closed Outlet */
    .outlet-closed {
      cursor: not-allowed;
      pointer-events: none;
    }
    .outlet-closed .outlet-img-wrap,
    .outlet-closed .card-body {
      filter: grayscale(0.6);
      opacity: 0.45;
      transition: filter 0.3s ease, opacity 0.3s ease;
    }

    /* Status Badges */
    .badge-open {
      background: #dcfce7;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }
    .badge-busy {
      background: #fef9c3;
      color: #a16207;
      border: 1px solid #fde047;
    }
    .badge-closed {
      background: #FDE8EB;
      color: #D2112C;
      border: 1px solid #fecaca;
    }

    /* ===== CLOSED OVERLAY ===== */
    .closed-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border-radius: 16px;
      animation: fadeIn 0.3s ease-out;
      pointer-events: none;
    }

    /* ===== TOAST ===== */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1A1A1A;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 9998;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 90vw;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 2px; }

    /* ===== SELECTION RING ===== */
    @keyframes selectPulse {
      0% { box-shadow: 0 0 0 0 rgba(0,120,172,0.3); }
      70% { box-shadow: 0 0 0 12px rgba(0,120,172,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,120,172,0); }
    }
    .selecting {
      animation: selectPulse 0.5s ease-out;
    }

    /* ===== TOPBAR ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-bottom: 1px solid #E5E7EB;
    }

    /* ===== IMAGE FALLBACK ===== */
    .img-fallback {
      background: linear-gradient(135deg, #E6F2F8 0%, #F3F4F6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>

  <script>
    // ===== SUPABASE SETUP =====
    const SUPABASE_URL = 'https://mzkbjfcdagomqirfsjld.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16a2JqZmNkYWdvbXFpcmZzamxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NTQ0MzcsImV4cCI6MjA5NTQzMDQzN30.H05EbXCSUYADZWlgOU1_rtxcYLFpjpg7W7Iaytc0OS4'
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    // ===== LOADING SCREEN =====
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden')
      }, 600)
    })

    // ===== TOAST =====
    function showToast(message, duration = 3500) {
      const toast = document.getElementById('toast')
      const toastMessage = document.getElementById('toast-message')
      toastMessage.textContent = message
      toast.classList.add('show')
      setTimeout(() => toast.classList.remove('show'), duration)
    }

    // ===== SELECT OUTLET =====
    window.selectOutlet = function(id) {
      const card = document.querySelector(`[data-outlet-id="${id}"]`)
      if (card && card.dataset.status === 'closed') {
        showToast('This outlet is currently closed. Please try another location.')
        return
      }

      const btn = event.currentTarget
      btn.classList.add('selecting')
      btn.style.pointerEvents = 'none'

      setTimeout(() => {
        localStorage.setItem('selected_outlet', id)
        window.location.href = 'menu.html'
      }, 350)
    }

    // ===== FORMAT DISTANCE =====
    function formatDistance(km) {
      if (!km && km !== 0) return ''
      if (km < 1) return `${Math.round(km * 1000)}m`
      return `${km.toFixed(1)}km`
    }

    // ===== GET STATUS BADGE =====
    function getStatusBadge(status) {
      const map = {
        'open': { cls: 'badge-open', label: 'Open', dot: '#16a34a' },
        'busy': { cls: 'badge-busy', label: 'Busy', dot: '#ca8a04' },
        'closed': { cls: 'badge-closed', label: 'Closed', dot: '#D2112C' }
      }
      const s = map[status] || map['open']
      return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold ${s.cls}">
        <span class="w-1.5 h-1.5 rounded-full" style="background:${s.dot}"></span>
        ${s.label}
      </span>`
    }

    // ===== GET IMAGE HTML =====
    function getOutletImage(imageUrl, name) {
      if (imageUrl) {
        return `<div class="outlet-img-wrap relative h-44 overflow-hidden bg-domGrayLight">
          <img src="${imageUrl}" alt="${name}" class="outlet-img w-full h-full object-cover" loading="lazy" 
            onerror="this.parentElement.innerHTML=getImageFallback('${name.replace(/'/g, "\'")}')">
          <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent"></div>
          <div class="absolute bottom-3 right-3">
            <span class="inline-flex items-center gap-1 text-white text-xs font-semibold bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/30">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
              Select
            </span>
          </div>
        </div>`
      }
      return getImageFallback(name)
    }

    function getImageFallback(name) {
      const initial = name.charAt(0).toUpperCase()
      return `<div class="img-fallback h-44 w-full relative">
        <div class="text-center">
          <div class="w-14 h-14 bg-domBlueLight rounded-xl mx-auto flex items-center justify-center text-domBlue text-xl font-extrabold mb-2">${initial}</div>
          <span class="text-domGray text-xs font-semibold">${name}</span>
        </div>
        <div class="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-domGrayLight/60 to-transparent"></div>
      </div>`
    }

    // ===== REALTIME: UPDATE SINGLE CARD =====
    function updateOutletCard(outlet) {
      console.log('=== updateOutletCard START ===', outlet.id, outlet.status)

      const card = document.querySelector(`[data-outlet-id="${outlet.id}"]`)
      if (!card) {
        console.log('Card NOT found for outlet id:', outlet.id)
        return
      }
      console.log('Card FOUND:', card)

      const newStatus = (outlet.status || 'open').toString().toLowerCase().trim()
      const currentStatus = (card.dataset.status || 'open').toString().toLowerCase().trim()
      const isClosed = newStatus === 'closed'
      const wasClosed = currentStatus === 'closed'

      console.log('currentStatus:', currentStatus, '| newStatus:', newStatus, '| wasClosed:', wasClosed, '| isClosed:', isClosed)

      if (newStatus === currentStatus) {
        console.log('Status unchanged, skipping update')
        return
      }

      // 1. Update data attribute
      card.dataset.status = newStatus
      console.log('Step 1: dataset.status set to', newStatus)

      // 2. Update badge
      const badgeContainer = card.querySelector('.status-badge-container')
      if (badgeContainer) {
        badgeContainer.innerHTML = getStatusBadge(newStatus)
        console.log('Step 2: badge updated to', newStatus)
      } else {
        console.log('Step 2: badge container NOT found!')
      }

      // 3. Handle closed/open state
      if (isClosed) {
        console.log('Step 3: CLOSING outlet')

        // Add closed class
        card.classList.add('outlet-closed')
        console.log('Step 3a: outlet-closed class ADDED. Classes now:', card.className)

        // Remove click handler
        card.removeAttribute('onclick')
        console.log('Step 3b: onclick removed')

        // Force reflow to ensure CSS transitions apply
        void card.offsetHeight

        // Add overlay if not exists
        let overlay = card.querySelector('.closed-overlay')
        if (!overlay) {
          console.log('Step 3c: creating NEW overlay')
          overlay = document.createElement('div')
          overlay.className = 'closed-overlay'
          overlay.innerHTML = `
            <div style="text-align:center; padding: 0 16px;">
              <div style="width:52px; height:52px; background:#FDE8EB; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; box-shadow: 0 2px 8px rgba(210,17,44,0.15);">
                <span style="font-size:24px;">😊</span>
              </div>
              <p style="color:#1A1A1A; font-weight:800; font-size:15px; margin-bottom:4px; letter-spacing:-0.3px;">We'll be back soon!</p>
              <p style="color:#6B7280; font-size:13px; font-weight:500;">This outlet is temporarily closed</p>
            </div>
          `
          card.appendChild(overlay)
          console.log('Step 3d: overlay APPENDED to card')
        } else {
          console.log('Step 3c: overlay already exists, skipping creation')
        }

        showToast(`${outlet.name} is temporarily closed — check back soon! 😊`, 4000)

      } else {
        console.log('Step 3: OPENING outlet')

        // Remove closed class
        card.classList.remove('outlet-closed')
        console.log('Step 3a: outlet-closed class REMOVED. Classes now:', card.className)

        // Restore click handler
        card.setAttribute('onclick', `selectOutlet(${outlet.id})`)
        console.log('Step 3b: onclick restored')

        // Force reflow
        void card.offsetHeight

        // Remove overlay
        const overlay = card.querySelector('.closed-overlay')
        if (overlay) {
          overlay.remove()
          console.log('Step 3c: overlay REMOVED')
        } else {
          console.log('Step 3c: no overlay found to remove')
        }

        showToast(`${outlet.name} is now open and ready to serve! 🎉`, 4000)
      }

      console.log('=== updateOutletCard END ===')
    }

    // ===== LOAD OUTLETS =====
    async function loadOutlets() {
      console.log('Loading outlets...')

      try {
        const { data, error } = await supabaseClient
          .from('outlets')
          .select('*')
          .eq('is_active', true)
          .order('name')

        console.log('Outlets data:', data)
        console.log('Outlets error:', error)

        if (error) throw error

        if (!data || data.length === 0) {
          document.getElementById('outlet-list').classList.add('hidden')
          document.getElementById('empty-state').classList.remove('hidden')
          document.getElementById('empty-state').classList.add('animate-slide-up')
          return
        }

        const html = data.map((o, index) => {
          const distance = formatDistance(o.distance_km)
          const status = (o.status || 'open').toString().toLowerCase().trim()
          const isClosed = status === 'closed'
          const badge = getStatusBadge(status)
          const imageHtml = getOutletImage(o.image_url, o.name)
          const delay = Math.min(index * 0.06, 0.4)

          const clickAttr = isClosed ? '' : `onclick="selectOutlet(${o.id})"`
          const closedClass = isClosed ? 'outlet-closed' : ''
          const closedOverlay = isClosed 
            ? `<div class="closed-overlay">
                <div style="text-align:center; padding: 0 16px;">
                  <div style="width:52px; height:52px; background:#FDE8EB; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; box-shadow: 0 2px 8px rgba(210,17,44,0.15);">
                    <span style="font-size:24px;">😊</span>
                  </div>
                  <p style="color:#1A1A1A; font-weight:800; font-size:15px; margin-bottom:4px; letter-spacing:-0.3px;">We'll be back soon!</p>
                  <p style="color:#6B7280; font-size:13px; font-weight:500;">This outlet is temporarily closed</p>
                </div>
              </div>` 
            : ''

          return `
          <button type="button" ${clickAttr}
            class="outlet-card w-full rounded-2xl shadow-sm border border-domLine text-left group cursor-pointer animate-slide-up ${closedClass}"
            style="animation-delay: ${delay}s; animation-fill-mode: both;"
            data-outlet-id="${o.id}"
            data-status="${status}">
            ${closedOverlay}
            ${imageHtml}
            <div class="card-body p-4 relative z-10">
              <div class="flex items-start justify-between gap-2 mb-2">
                <h3 class="text-base font-bold text-domDark group-hover:text-domBlue transition-colors leading-tight">${o.name}</h3>
                <span class="status-badge-container flex-shrink-0">${badge}</span>
              </div>
              <p class="text-[13px] text-domGray leading-relaxed line-clamp-2 font-medium">${o.location || ''}</p>
              <div class="flex items-center flex-wrap gap-x-4 gap-y-1.5 mt-3 pt-3 border-t border-domLine/60">
                ${o.phone ? `<span class="inline-flex items-center gap-1.5 text-xs text-domGray font-medium">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
                  </svg>
                  ${o.phone}
                </span>` : ''}
                ${distance ? `<span class="inline-flex items-center gap-1.5 text-xs text-domGray font-medium">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                  </svg>
                  ${distance}
                </span>` : ''}
                ${o.rating ? `<span class="inline-flex items-center gap-1 text-xs text-amber-600 font-bold">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                  </svg>
                  ${o.rating}
                </span>` : ''}
              </div>
            </div>
          </button>
        `}).join('')

        document.getElementById('outlet-list').innerHTML = html

        // Start realtime subscription after initial load
        subscribeToOutlets()

      } catch (err) {
        console.error('Failed to load outlets:', err)
        document.getElementById('outlet-list').innerHTML = `
          <div class="col-span-full" style="max-width:100%;">
            <div class="bg-domRedLight border border-red-200 rounded-2xl p-8 text-center animate-fade-in max-w-md mx-auto">
              <div class="w-14 h-14 bg-white rounded-xl mx-auto flex items-center justify-center mb-4 shadow-sm">
                <svg class="w-7 h-7 text-domRed" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
                </svg>
              </div>
              <h3 class="text-xl font-bold text-domDark mb-2">Unable to load outlets</h3>
              <p class="text-domGray text-sm mb-5 font-medium">Please check your connection and try again.</p>
              <button onclick="loadOutlets()" class="inline-flex items-center gap-2 px-5 py-2.5 bg-domBlue hover:bg-domBlueDark text-white rounded-xl text-sm font-bold transition-colors shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182"/>
                </svg>
                Try Again
              </button>
            </div>
          </div>
        `
        showToast('Connection error. Please try again.')
      }
    }

    // ===== REALTIME SUBSCRIPTION =====
    let outletChannel = null

    function subscribeToOutlets() {
      console.log('Subscribing to outlet status updates...')

      if (outletChannel) {
        supabaseClient.removeChannel(outletChannel)
      }

      outletChannel = supabaseClient
        .channel('outlets-status-customer')
        .on('postgres_changes', { 
          event: '*', 
          schema: 'public', 
          table: 'outlets'
        }, payload => {
          console.log('=== REALTIME PAYLOAD ===', payload)

          if (payload.new && payload.new.id != null) {
            console.log('Calling updateOutletCard with:', payload.new)
            updateOutletCard(payload.new)
          } else {
            console.log('Payload missing new.id, skipping. payload.new:', payload.new)
          }
        })
        .subscribe((status) => {
          console.log('Realtime subscription status:', status)
          if (status === 'SUBSCRIBED') {
            console.log('Successfully subscribed to outlet updates')
          }
          if (status === 'CHANNEL_ERROR') {
            console.error('Realtime channel error — retrying in 3s...')
            setTimeout(subscribeToOutlets, 3000)
          }
          if (status === 'TIMED_OUT') {
            console.warn('Realtime subscription timed out — retrying...')
            setTimeout(subscribeToOutlets, 3000)
          }
        })
    }

    // Load immediately
    loadOutlets()

    // ===== PWA =====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.log('SW failed:', err))
    }
  </script>

</body>
</html>
