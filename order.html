<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Location — Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#C4A77D">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: {
              50: '#FDFCF8',
              100: '#F7F3EB',
              200: '#EDE5D3',
              300: '#E0D4BC',
              400: '#C4A77D',
              500: '#B08D5F',
              600: '#8B7348',
              700: '#6B5A3A',
              800: '#4A3D28',
              900: '#2C2518',
            },
            espresso: {
              700: '#3E2723',
              800: '#2C1B18',
              900: '#1A0F0D',
            }
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'slide-up': 'slideUp 0.5s ease-out',
            'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
            'shimmer': 'shimmer 2s infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            pulseSoft: {
              '0%, 100%': { opacity: '1', transform: 'scale(1)' },
              '50%': { opacity: '0.8', transform: 'scale(1.02)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Inter', system-ui, sans-serif; 
      background-color: #FDFCF8;
      background-image: radial-gradient(#E0D4BC 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Loader */
    #loader {
      position: fixed; inset: 0; background: #FDFCF8; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-logo { 
      width: 100px; height: 100px; 
      animation: pulseSoft 2s ease-in-out infinite; 
      filter: drop-shadow(0 4px 12px rgba(139, 115, 72, 0.15));
    }
    .loader-track { 
      width: 140px; height: 3px; 
      background: #EDE5D3; border-radius: 3px; margin-top: 28px; overflow: hidden;
    }
    .loader-fill { 
      width: 40%; height: 100%; 
      background: linear-gradient(90deg, #C4A77D, #8B7348, #C4A77D);
      background-size: 200% 100%;
      border-radius: 3px; 
      animation: shimmer 1.5s ease-in-out infinite;
    }
    .loader-text { 
      margin-top: 20px; font-size: 12px; color: #8B7348; 
      letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500;
    }

    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg, #F7F3EB 25%, #EDE5D3 50%, #F7F3EB 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 12px;
    }

    /* Outlet Card */
    .outlet-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .outlet-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(to bottom, #C4A77D, #8B7348);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .outlet-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -8px rgba(139, 115, 72, 0.15), 0 4px 8px -2px rgba(139, 115, 72, 0.08);
      border-color: #C4A77D;
    }
    .outlet-card:hover::before { opacity: 1; }
    .outlet-card:hover .outlet-arrow {
      opacity: 1;
      transform: translateX(0);
    }
    .outlet-arrow {
      opacity: 0;
      transform: translateX(-8px);
      transition: all 0.3s ease;
    }

    /* Status Badge */
    .status-open {
      background: rgba(34, 197, 94, 0.1);
      color: #16a34a;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    .status-busy {
      background: rgba(234, 179, 8, 0.1);
      color: #ca8a04;
      border: 1px solid rgba(234, 179, 8, 0.2);
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1A0F0D;
      color: #FDFCF8;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 9998;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #C4A77D; border-radius: 3px; }

    /* Selection ring animation */
    @keyframes selectPulse {
      0% { box-shadow: 0 0 0 0 rgba(196, 167, 125, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(196, 167, 125, 0); }
      100% { box-shadow: 0 0 0 0 rgba(196, 167, 125, 0); }
    }
    .selecting {
      animation: selectPulse 0.6s ease-out;
    }
  </style>
<base target="_blank">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Loading Screen -->
  <div id="loader">
    <img src="logo.svg" alt="Your Cafe" class="loader-logo" onerror="this.style.display='none'; document.querySelector('.loader-fallback').style.display='flex'">
    <div class="loader-fallback hidden w-24 h-24 bg-cream-400 rounded-full items-center justify-center text-white text-4xl shadow-xl">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
        <line x1="6" y1="1" x2="6" y2="4"></line>
        <line x1="10" y1="1" x2="10" y2="4"></line>
        <line x1="14" y1="1" x2="14" y2="4"></line>
      </svg>
    </div>
    <div class="loader-track"><div class="loader-fill"></div></div>
    <p class="loader-text">Preparing your experience</p>
  </div>

  <!-- Toast Notification -->
  <div id="toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <span id="toast-message">Something went wrong</span>
  </div>

  <div class="w-full max-w-lg">
    <!-- Back Link -->
    <a href="index.html" class="inline-flex items-center gap-2 text-cream-600 text-sm font-medium hover:text-espresso-900 transition-colors mb-8 group">
      <svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to Home
    </a>

    <!-- Header -->
    <div class="text-center mb-10 animate-fade-in">
      <div class="relative w-20 h-20 mx-auto mb-6">
        <div class="absolute inset-0 bg-cream-400 rounded-full opacity-20 animate-pulse-soft"></div>
        <div class="relative w-20 h-20 bg-white rounded-full mx-auto flex items-center justify-center shadow-lg border-2 border-cream-200">
          <img src="image/logo.svg" alt="Your Cafe" class="w-12 h-12 object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
          <div class="hidden text-cream-500">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
              <line x1="6" y1="1" x2="6" y2="4"></line>
              <line x1="10" y1="1" x2="10" y2="4"></line>
              <line x1="14" y1="1" x2="14" y2="4"></line>
            </svg>
          </div>
        </div>
      </div>
      <h1 class="font-display text-3xl font-bold text-espresso-900 tracking-tight">Order Online</h1>
      <p class="text-cream-600 mt-3 text-base font-light">Select your nearest outlet to begin</p>
    </div>

    <!-- Outlet List -->
    <div id="outlet-list" class="space-y-4">
      <!-- Skeleton Loading State -->
      <div class="bg-white p-5 rounded-2xl border border-cream-200 shadow-sm">
        <div class="flex items-center justify-between">
          <div class="space-y-3 flex-1">
            <div class="skeleton h-5 w-2/3"></div>
            <div class="skeleton h-4 w-1/2"></div>
            <div class="skeleton h-3 w-1/3"></div>
          </div>
          <div class="skeleton h-8 w-8 rounded-full ml-4"></div>
        </div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-cream-200 shadow-sm">
        <div class="flex items-center justify-between">
          <div class="space-y-3 flex-1">
            <div class="skeleton h-5 w-3/4"></div>
            <div class="skeleton h-4 w-1/2"></div>
            <div class="skeleton h-3 w-1/4"></div>
          </div>
          <div class="skeleton h-8 w-8 rounded-full ml-4"></div>
        </div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-cream-200 shadow-sm">
        <div class="flex items-center justify-between">
          <div class="space-y-3 flex-1">
            <div class="skeleton h-5 w-1/2"></div>
            <div class="skeleton h-4 w-2/3"></div>
            <div class="skeleton h-3 w-1/3"></div>
          </div>
          <div class="skeleton h-8 w-8 rounded-full ml-4"></div>
        </div>
      </div>
    </div>

    <!-- Empty State (hidden by default) -->
    <div id="empty-state" class="hidden text-center py-12">
      <div class="w-16 h-16 bg-cream-100 rounded-full mx-auto flex items-center justify-center mb-4">
        <svg class="w-8 h-8 text-cream-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/>
        </svg>
      </div>
      <h3 class="font-display text-lg font-semibold text-espresso-900">No outlets found</h3>
      <p class="text-cream-600 mt-2 text-sm">We're expanding to your area soon. Check back later!</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ===== SUPABASE SETUP =====
    const SUPABASE_URL = 'https://mzkbjfcdagomqirfsjld.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16a2JqZmNkYWdvbXFpcmZzamxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NTQ0MzcsImV4cCI6MjA5NTQzMDQzN30.H05EbXCSUYADZWlgOU1_rtxcYLFpjpg7W7Iaytc0OS4'
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    // ===== LOADING SCREEN =====
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden')
      }, 1000)
    })

    // ===== TOAST =====
    function showToast(message, duration = 4000) {
      const toast = document.getElementById('toast')
      const toastMessage = document.getElementById('toast-message')
      toastMessage.textContent = message
      toast.classList.add('show')
      setTimeout(() => toast.classList.remove('show'), duration)
    }

    // ===== SELECT OUTLET =====
    window.selectOutlet = function(id) {
      const btn = event.currentTarget
      btn.classList.add('selecting')
      btn.style.pointerEvents = 'none'

      setTimeout(() => {
        localStorage.setItem('selected_outlet', id)
        window.location.href = 'menu.html'
      }, 400)
    }

    // ===== FORMAT DISTANCE =====
    function formatDistance(km) {
      if (!km && km !== 0) return ''
      if (km < 1) return `${Math.round(km * 1000)}m away`
      return `${km.toFixed(1)}km away`
    }

    // ===== GET STATUS BADGE =====
    function getStatusBadge(status) {
      const statuses = {
        'open': { class: 'status-open', label: 'Open', icon: '<circle cx="12" cy="12" r="10" fill="currentColor" opacity="0.2"/><circle cx="12" cy="12" r="3" fill="currentColor"/>' },
        'busy': { class: 'status-busy', label: 'Busy', icon: '<circle cx="12" cy="12" r="10" fill="currentColor" opacity="0.2"/><path d="M12 8v4l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' },
        'closed': { class: 'bg-red-50 text-red-600 border border-red-200', label: 'Closed', icon: '<circle cx="12" cy="12" r="10" fill="currentColor" opacity="0.2"/><path d="M15 9l-6 6M9 9l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' }
      }
      const s = statuses[status] || statuses['open']
      return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${s.class}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none">${s.icon}</svg>
        ${s.label}
      </span>`
    }

    // ===== LOAD OUTLETS =====
    async function loadOutlets() {
      console.log('Loading outlets...')

      try {
        const { data, error } = await supabaseClient
          .from('outlets')
          .select('*')
          .eq('is_active', true)
          .order('name')

        console.log('Outlets data:', data)
        console.log('Outlets error:', error)

        if (error) {
          throw error
        }

        if (!data || data.length === 0) {
          document.getElementById('outlet-list').classList.add('hidden')
          document.getElementById('empty-state').classList.remove('hidden')
          document.getElementById('empty-state').classList.add('animate-slide-up')
          return
        }

        const html = data.map((o, index) => {
          const distance = formatDistance(o.distance_km)
          const status = o.status || 'open'
          const badge = getStatusBadge(status)
          const delay = index * 0.08

          return `
          <button type="button" onclick="selectOutlet(${o.id})" 
            class="outlet-card w-full bg-white p-5 rounded-2xl shadow-sm border border-cream-200 text-left group cursor-pointer animate-slide-up"
            style="animation-delay: ${delay}s; animation-fill-mode: both;">
            <div class="flex items-start justify-between gap-4">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-2 flex-wrap">
                  <h3 class="font-display text-lg font-bold text-espresso-900 group-hover:text-cream-600 transition-colors">${o.name}</h3>
                  ${badge}
                </div>
                <p class="text-sm text-cream-600 leading-relaxed">${o.location || ''}</p>
                <div class="flex items-center gap-4 mt-3 text-xs text-cream-500">
                  ${o.phone ? `<span class="inline-flex items-center gap-1.5">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
                    </svg>
                    ${o.phone}
                  </span>` : ''}
                  ${distance ? `<span class="inline-flex items-center gap-1.5">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="10"/>
                      <path d="M12 6v6l4 2"/>
                    </svg>
                    ${distance}
                  </span>` : ''}
                  ${o.rating ? `<span class="inline-flex items-center gap-1 text-amber-600">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    ${o.rating}
                  </span>` : ''}
                </div>
              </div>
              <div class="outlet-arrow flex-shrink-0 w-10 h-10 rounded-full bg-cream-50 flex items-center justify-center text-cream-500 group-hover:bg-cream-400 group-hover:text-white transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
              </div>
            </div>
          </button>
        `}).join('')

        document.getElementById('outlet-list').innerHTML = html

      } catch (err) {
        console.error('Failed to load outlets:', err)
        document.getElementById('outlet-list').innerHTML = `
          <div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-center animate-fade-in">
            <div class="w-12 h-12 bg-red-100 rounded-full mx-auto flex items-center justify-center mb-3">
              <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
              </svg>
            </div>
            <h3 class="font-display text-lg font-semibold text-red-900 mb-1">Unable to load outlets</h3>
            <p class="text-red-600 text-sm mb-4">Please check your connection and try again.</p>
            <button onclick="loadOutlets()" class="inline-flex items-center gap-2 px-4 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg text-sm font-medium transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182"/>
              </svg>
              Try Again
            </button>
          </div>
        `
        showToast('Connection error. Please try again.')
      }
    }

    // Load immediately
    loadOutlets()

    // ===== PWA =====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.log('SW failed:', err))
    }
  </script>

</body>
</html>
