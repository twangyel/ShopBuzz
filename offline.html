<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Your Cafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="text-center max-w-md">
    <div class="w-20 h-20 bg-gray-200 rounded-full flex items-center justify-center text-3xl mx-auto mb-6">📡</div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">You're Offline</h1>
    <p class="text-gray-500 mb-6">Please check your internet connection and try again.</p>
    <button onclick="location.reload()" class="bg-gray-900 text-white px-6 py-3 rounded-lg font-medium hover:bg-gray-800 transition">
      Try Again
    </button>
  </div>
</body>
</html>
