<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Order Confirmed · Bean & Bond</title>

  <!-- Tailwind CSS + Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
    }

    /* smooth fade-up animation */
    .fade-up {
      animation: fadeUp 0.55s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* modern pulse for status */
    @keyframes modernPulse {
      0% { opacity: 1; transform: scale(1); background-color: #10b981; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { opacity: 0.9; transform: scale(1.1); background-color: #34d399; box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { opacity: 1; transform: scale(1); background-color: #10b981; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .pulse-modern {
      animation: modernPulse 1.6s infinite ease;
    }

    /* custom focus ring */
    .focus-ring-custom:focus {
      outline: none;
      ring: 2px solid #2c7a7b;
      ring-offset: 2px;
    }
    
    /* subtle floating shadow on hover for buttons */
    .btn-lift {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px -12px rgba(0, 0, 0, 0.2);
    }
    .btn-lift:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#EFF6F5] via-[#E4ECEF] to-[#D9E2E8] flex items-center justify-center px-4 py-8">

  <div class="w-full max-w-md fade-up">
    
    <!-- main card – fresh theme: deep teal / gold accents -->
    <div class="bg-white rounded-3xl shadow-2xl shadow-teal-900/5 border border-white/60 overflow-hidden transition-all duration-300">
      
      <!-- top accent bar – modern teal to warm gold gradient -->
      <div class="h-1.5 bg-gradient-to-r from-[#1F5E6E] via-[#378F8F] to-[#EBB26A]"></div>

      <!-- main content -->
      <div class="p-6 sm:p-8">
        
        <!-- modern logo area: stylized cup + brand hint -->
        <div class="flex justify-center mb-5">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#1F5E6E] to-[#2D828F] flex items-center justify-center shadow-md shadow-teal-500/20">
            <!-- clean coffee bean + cup combined icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FEF9F0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 8h1a4 4 0 0 1 0 8h-1" />
              <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" />
              <path d="M8 2v3" />
              <path d="M12 2v3" />
              <path d="M16 2v3" />
            </svg>
          </div>
        </div>

        <!-- success badge + heading (modernized) -->
        <div class="text-center space-y-1.5">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-50 shadow-sm ring-1 ring-emerald-100 mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-emerald-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <h1 class="font-extrabold text-3xl tracking-tight text-gray-800">Order confirmed</h1>
          <p class="text-gray-500 text-sm max-w-[260px] mx-auto">
            Your order is locked in — we’re brewing perfection.
          </p>
        </div>

        <!-- Order card with copy & sleek border -->
        <div class="mt-6 bg-white rounded-2xl border border-gray-200 shadow-sm p-5 transition-all hover:shadow-md">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div class="text-center sm:text-left">
              <p class="text-[11px] font-semibold uppercase tracking-wider text-teal-600">Order reference</p>
              <div class="flex items-center gap-2 justify-center sm:justify-start mt-1">
                <span id="order-number" class="text-3xl sm:text-4xl font-mono font-bold tracking-wide text-[#1F5E6E]">#----</span>
                <button id="copy-order-btn" class="p-1.5 rounded-full bg-gray-50 border border-gray-200 hover:bg-teal-50 hover:border-teal-200 transition-all focus:outline-none focus:ring-2 focus:ring-teal-300" aria-label="Copy order number">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-teal-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                  </svg>
                </button>
              </div>
            </div>
            <!-- toast message container (inline) -->
            <div id="copy-toast" class="text-xs text-teal-800 bg-teal-50 px-3 py-1.5 rounded-full hidden transition-all text-center sm:text-left"></div>
          </div>
        </div>

        <!-- dynamic order status + timeline (fresh modern) -->
        <div class="mt-5 space-y-3">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div class="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-full py-1.5 px-4">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-modern"></span>
              <span class="text-sm font-semibold text-gray-700">Preparing your order</span>
            </div>
            <div class="flex items-center gap-1.5 text-xs text-gray-500 bg-white/80 px-3 py-1.5 rounded-full border border-gray-100">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
              <span id="estimated-time" class="font-medium">~12 min</span>
            </div>
          </div>

          <!-- placed & ready details with gradient icons -->
          <div class="grid grid-cols-2 gap-3 bg-gray-50/70 rounded-xl p-3 border border-gray-100">
            <div class="flex items-start gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-teal-600 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
              <div>
                <p class="text-[11px] uppercase text-gray-400 tracking-wider">Placed at</p>
                <p id="placed-time" class="font-medium text-gray-700 text-sm">--:-- --</p>
              </div>
            </div>
            <div class="flex items-start gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-amber-600 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M12 8v4l3 3M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"/>
              </svg>
              <div>
                <p class="text-[11px] uppercase text-gray-400 tracking-wider">Est. pickup</p>
                <p id="ready-time" class="font-medium text-gray-700 text-sm">--:-- --</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Action buttons (fresh, modern with teal primary) -->
        <div class="mt-7 space-y-3">
          <a id="track-link" href="track.html" class="btn-lift block w-full text-center bg-[#1F5E6E] hover:bg-[#164c59] transition-all text-white font-semibold py-3.5 rounded-xl shadow-md">
            Track order
          </a>
          
          <a href="menu.html" class="btn-lift block w-full text-center bg-white border border-gray-300 hover:bg-gray-50 hover:border-teal-200 transition-all text-gray-700 font-medium py-3 rounded-xl">
            Order more
          </a>
          
          <div class="text-center pt-1">
            <a href="index.html" class="inline-flex items-center gap-1 text-xs text-gray-400 hover:text-teal-700 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
              </svg>
              Back to home
            </a>
          </div>
        </div>
      </div>

      <!-- footer note (clean & minimal) -->
      <div class="bg-gray-50/80 border-t border-gray-100 px-6 py-3.5 text-center">
        <p class="text-xs text-gray-500">Keep this order number handy — just show it at pickup ✨</p>
      </div>
    </div>

    <!-- subtle support line -->
    <div class="text-center mt-5 text-xs text-gray-400">
      Questions? <a href="#" class="text-teal-600 underline-offset-2 hover:underline font-medium">support@beanandbond.com</a>
    </div>
  </div>

  <script>
    (function() {
      // ------ extract order number from URL or generate professional mock ----
      const urlParams = new URLSearchParams(window.location.search);
      let orderParam = urlParams.get('order');
      
      let finalOrderNumber = (orderParam && orderParam.trim() !== "") ? orderParam : "BOND" + Math.floor(Math.random() * 9000 + 1000);
      
      // display order number
      const orderSpan = document.getElementById('order-number');
      if (orderSpan) {
        orderSpan.textContent = `#${finalOrderNumber}`;
      }

      // update track link with order param
      const trackLink = document.getElementById('track-link');
      if (trackLink) {
        trackLink.href = `track.html?order=${encodeURIComponent(finalOrderNumber)}`;
      }
      
      // ------ dynamic times (placed & ready) ------
      const now = new Date();
      const placedElem = document.getElementById('placed-time');
      if (placedElem) {
        const dateOptions = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        placedElem.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        // adding a bit more style: also show date for professional touch
        const dayPart = now.toLocaleDateString([], { month: 'short', day: 'numeric' });
        placedElem.textContent = `${dayPart} · ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      }
      
      // estimated ready time (9-15 mins dynamic)
      const minsToAdd = Math.floor(Math.random() * (14 - 8 + 1) + 8); // 8-14 min
      const readyDate = new Date(now.getTime() + minsToAdd * 60000);
      const readyFormatted = readyDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const readyTimeElem = document.getElementById('ready-time');
      if (readyTimeElem) {
        readyTimeElem.textContent = readyFormatted;
      }
      
      const estSpan = document.getElementById('estimated-time');
      if (estSpan) {
        estSpan.textContent = `~${minsToAdd} min`;
      }
      
      // ------ COPY ORDER NUMBER with modern feedback toast ------
      const copyBtn = document.getElementById('copy-order-btn');
      const toastEl = document.getElementById('copy-toast');
      
      function showToastMessage(msg, isError = false) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.remove('hidden', 'bg-teal-50', 'bg-rose-50', 'text-teal-800', 'text-rose-600');
        if (isError) {
          toastEl.classList.add('bg-rose-50', 'text-rose-600');
        } else {
          toastEl.classList.add('bg-teal-50', 'text-teal-800');
        }
        toastEl.classList.remove('hidden');
        setTimeout(() => {
          toastEl.classList.add('hidden');
        }, 2000);
      }
      
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          const orderFull = `#${finalOrderNumber}`;
          try {
            await navigator.clipboard.writeText(orderFull);
            showToastMessage(`✓ Copied ${orderFull}`, false);
          } catch (err) {
            // fallback for older browsers
            const textArea = document.createElement('textarea');
            textArea.value = orderFull;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showToastMessage(`✓ Copied ${orderFull}`, false);
          }
        });
      }
      
      // subtle console reassurance
      console.log(`[Order confirmed] ${finalOrderNumber} · ready around ${readyFormatted}`);
      
      // optional: make toast responsive alignment cleaner
      const adjustToastResponsive = () => {
        if (window.innerWidth < 640 && toastEl) {
          toastEl.classList.add('text-center', 'justify-center');
        } else {
          toastEl.classList.remove('text-center');
        }
      };
      adjustToastResponsive();
      window.addEventListener('resize', adjustToastResponsive);
    })();
  </script>
</body>
</html>
