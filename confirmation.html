<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Your Cafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .font-display { font-family: 'Playfair Display', Georgia, serif; }
  </style>
</head>
<body class="bg-cream-50 min-h-screen flex items-center justify-center p-4">

  <div class="text-center max-w-md w-full">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center text-green-600 text-3xl mx-auto mb-6">✓</div>
    
    <h1 class="font-display text-3xl font-bold text-espresso-900 mb-2">Order Placed!</h1>
    <p class="text-cream-600 mb-8">Thank you for ordering with us.</p>

    <div class="bg-white p-6 rounded-xl border border-cream-200 shadow-sm mb-6">
      <p class="text-sm text-cream-500 uppercase tracking-wide mb-2">Your Order Number</p>
      <p id="order-number" class="text-4xl font-bold text-espresso-900 font-mono tracking-wider">---</p>
    </div>

    <div class="space-y-3">
      <a href="track.html" class="block w-full bg-orange-600 text-white py-3.5 rounded-xl font-semibold hover:bg-orange-700 transition shadow-md">
        Track Your Order
      </a>
      <a href="menu.html" class="block w-full bg-white border border-cream-200 text-espresso-700 py-3.5 rounded-xl font-medium hover:bg-cream-50 transition">
        Order More
      </a>
      <a href="index.html" class="block text-cream-500 text-sm hover:text-espresso-700 py-2">
        ← Back to Home
      </a>
    </div>

    <p class="text-xs text-cream-400 mt-8">Show this order number when you arrive for pickup</p>
  </div>

  <script>
    // Get order number from URL
    const params = new URLSearchParams(window.location.search)
    const orderNum = params.get('order')
    if (orderNum) {
      document.getElementById('order-number').textContent = orderNum
    }
  </script>

</body>
</html>
