<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Cafe Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

  <!-- LOGIN -->
  <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-lg border border-gray-100 w-full max-w-md">
      <div class="text-center mb-8">
        <div class="w-12 h-12 bg-orange-600 rounded-xl flex items-center justify-center text-white text-xl mx-auto mb-4">☕</div>
        <h1 class="text-2xl font-bold">Cafe Portal</h1>
        <p class="text-gray-500 text-sm mt-1">Staff & Management Only</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="login-email" required class="w-full border border-gray-200 rounded-lg px-4 py-3 focus:ring-2 focus:ring-orange-500 outline-none" placeholder="admin@yourcafe.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" id="login-password" required class="w-full border border-gray-200 rounded-lg px-4 py-3 focus:ring-2 focus:ring-orange-500 outline-none" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-gray-900 text-white py-3 rounded-lg font-semibold hover:bg-gray-800 transition">Sign In</button>
      </form>
      <p id="login-error" class="text-red-600 text-sm mt-4 hidden text-center"></p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-view" class="hidden">
    <header class="bg-white border-b sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <span class="text-xl">☕</span>
          <h1 class="font-bold text-lg">Cafe Portal</h1>
        </div>
        <div class="flex items-center gap-4">
          <span id="staff-email" class="text-sm text-gray-500 hidden sm:inline"></span>
          <button onclick="logout()" class="text-sm text-red-600 hover:text-red-700 font-medium">Logout</button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
      <!-- Stats -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <div class="bg-white p-4 rounded-xl border shadow-sm">
          <p class="text-gray-500 text-xs uppercase font-medium">Today</p>
          <p id="stat-today" class="text-2xl font-bold">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl border shadow-sm">
          <p class="text-gray-500 text-xs uppercase font-medium">Pending</p>
          <p id="stat-pending" class="text-2xl font-bold text-orange-600">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl border shadow-sm">
          <p class="text-gray-500 text-xs uppercase font-medium">Preparing</p>
          <p id="stat-preparing" class="text-2xl font-bold text-blue-600">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl border shadow-sm">
          <p class="text-gray-500 text-xs uppercase font-medium">Ready</p>
          <p id="stat-ready" class="text-2xl font-bold text-green-600">0</p>
        </div>
      </div>

      <!-- Filters -->
      <div class="flex flex-wrap gap-2 mb-4">
        <button onclick="filterOrders('all')" class="filter-btn active px-4 py-2 rounded-lg text-sm font-medium bg-gray-900 text-white" data-filter="all">All</button>
        <button onclick="filterOrders('pending')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-white border text-gray-700" data-filter="pending">Pending</button>
        <button onclick="filterOrders('confirmed')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-white border text-gray-700" data-filter="confirmed">Confirmed</button>
        <button onclick="filterOrders('preparing')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-white border text-gray-700" data-filter="preparing">Preparing</button>
        <button onclick="filterOrders('ready')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-white border text-gray-700" data-filter="ready">Ready</button>
        <button onclick="filterOrders('completed')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-white border text-gray-700" data-filter="completed">Completed</button>
      </div>

      <!-- Orders Table -->
      <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead class="bg-gray-50 border-b text-xs uppercase text-gray-500 font-medium">
              <tr>
                <th class="px-3 py-3">Order #</th>
                <th class="px-3 py-3">Customer</th>
                <th class="px-3 py-3">Items</th>
                <th class="px-3 py-3">Total</th>
                <th class="px-3 py-3">Status</th>
                <th class="px-3 py-3">Time</th>
                <th class="px-3 py-3">Action</th>
              </tr>
            </thead>
            <tbody id="orders-table" class="divide-y divide-gray-100">
              <tr><td colspan="7" class="px-4 py-8 text-center text-gray-400">Loading orders...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 right-4 bg-gray-900 text-white px-5 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition duration-300 z-50 text-sm font-medium"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://mzkbjfcdagomqirfsjld.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16a2JqZmNkYWdvbXFpcmZzamxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NTQ0MzcsImV4cCI6MjA5NTQzMDQzN30.H05EbXCSUYADZWlgOU1_rtxcYLFpjpg7W7Iaytc0OS4'
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    let allOrders = []
    let currentFilter = 'all'

    // Check session
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) showDashboard(session.user.email)
    })

    // Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const email = document.getElementById('login-email').value
      const password = document.getElementById('login-password').value
      
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password })
      if (error) {
        document.getElementById('login-error').textContent = error.message
        document.getElementById('login-error').classList.remove('hidden')
      } else {
        showDashboard(data.user.email)
      }
    })

    function showDashboard(email) {
      document.getElementById('login-view').classList.add('hidden')
      document.getElementById('dashboard-view').classList.remove('hidden')
      document.getElementById('staff-email').textContent = email
      loadOrders()
      setInterval(loadOrders, 15000) // Auto-refresh every 15s
    }

    async function logout() {
      await supabaseClient.auth.signOut()
      location.reload()
    }

    async function loadOrders() {
      const { data: orders } = await supabaseClient
        .from('orders')
        .select('*, order_items(*)')
        .order('created_at', { ascending: false })
        .limit(100)

      allOrders = orders || []
      renderOrders()
      updateStats()
    }

    function updateStats() {
      const today = new Date().toISOString().split('T')[0]
      document.getElementById('stat-today').textContent = allOrders.filter(o => o.created_at.startsWith(today)).length
      document.getElementById('stat-pending').textContent = allOrders.filter(o => o.status === 'pending').length
      document.getElementById('stat-preparing').textContent = allOrders.filter(o => o.status === 'preparing').length
      document.getElementById('stat-ready').textContent = allOrders.filter(o => o.status === 'ready').length
    }

    function filterOrders(status) {
      currentFilter = status
      document.querySelectorAll('.filter-btn').forEach(btn => {
        const isActive = btn.dataset.filter === status
        btn.classList.toggle('bg-gray-900', isActive)
        btn.classList.toggle('text-white', isActive)
        btn.classList.toggle('bg-white', !isActive)
        btn.classList.toggle('text-gray-700', !isActive)
      })
      renderOrders()
    }

    function renderOrders() {
      const tbody = document.getElementById('orders-table')
      let filtered = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter)

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-gray-400">No orders found</td></tr>'
        return
      }

      const statusColors = {
        pending: 'bg-yellow-100 text-yellow-800',
        confirmed: 'bg-blue-100 text-blue-800',
        preparing: 'bg-purple-100 text-purple-800',
        ready: 'bg-green-100 text-green-800',
        completed: 'bg-gray-100 text-gray-800',
        cancelled: 'bg-red-100 text-red-800'
      }

      tbody.innerHTML = filtered.map(order => {
        const time = new Date(order.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        const itemCount = order.order_items?.reduce((sum, i) => sum + i.quantity, 0) || 0

        return `
          <tr class="hover:bg-gray-50 transition">
            <td class="px-3 py-3 font-mono text-xs text-gray-500">#${order.order_number || order.id.slice(0,8).toUpperCase()}</td>
            <td class="px-3 py-3">
              <div class="font-medium text-gray-900">${order.customer_name}</div>
              <div class="text-gray-500 text-xs">${order.customer_phone}</div>
            </td>
            <td class="px-3 py-3 text-gray-600">${itemCount} items</td>
            <td class="px-3 py-3 font-semibold">$${order.total_amount}</td>
            <td class="px-3 py-3">
              <span class="text-xs font-medium px-2 py-1 rounded-full ${statusColors[order.status] || 'bg-gray-100'}">${order.status}</span>
            </td>
            <td class="px-3 py-3 text-gray-500 text-xs">${time}</td>
            <td class="px-3 py-3">
              <select onchange="updateStatus('${order.id}', this.value)" class="text-xs border rounded-lg px-2 py-1 bg-white cursor-pointer hover:border-orange-400 outline-none">
                <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                <option value="preparing" ${order.status === 'preparing' ? 'selected' : ''}>Preparing</option>
                <option value="ready" ${order.status === 'ready' ? 'selected' : ''}>Ready</option>
                <option value="completed" ${order.status === 'completed' ? 'selected' : ''}>Completed</option>
                <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
            </td>
          </tr>
        `
      }).join('')
    }

    async function updateStatus(orderId, status) {
      const { error } = await supabaseClient.from('orders').update({ status }).eq('id', orderId)
      if (!error) {
        showToast(`Order updated to ${status}`)
        loadOrders()
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast')
      toast.textContent = msg
      toast.classList.remove('translate-y-20', 'opacity-0')
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2000)
    }
  </script>

</body>
</html>
