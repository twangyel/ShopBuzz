<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuzzCafe - Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/menu.css">
  <meta name="theme-color" content="#C4A77D">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: {
              50: '#FDFCF8',
              100: '#F7F1E8',
              200: '#E8DCCB',
              400: '#C4A77D',
              500: '#B08968',
              600: '#8B6B4A'
            },
            espresso: {
              700: '#3B2A1F',
              800: '#2A1B14',
              900: '#1A130C'
            }
          }
        }
      }
    }
  </script>
<base target="_blank">
</head>
<body>
  <!-- Loader -->
  <div id="loader">
    <div class="w-16 h-16 bg-cream-500 rounded-full flex items-center justify-center text-white text-2xl animate-pulse">☕</div>
    <p class="text-cream-600 text-xs mt-4 tracking-widest uppercase">Loading Menu</p>
  </div>

  <!-- Header -->
  <header class="bg-white border-b border-cream-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-2 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-cream-600 hover:text-espresso-900 text-sm">←</a>
        <div class="flex items-center gap-2">
          <a href="index.html"><img src="image/logo.svg" alt=""></a>
          <div>
            <h1 class="font-bold text-espresso-900 text-sm leading-tight" id="outlet-name">Menu</h1>
            <select id="outlet-switcher" class="text-[11px] text-cream-600 bg-transparent border border-cream-200 rounded px-1.5 py-0.5 focus:outline-none focus:border-cream-500 cursor-pointer leading-tight">
              <option value="">Loading outlets...</option>
            </select>
          </div>
        </div>
      </div>
      <a href="cart.html" class="relative bg-espresso-900 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 hover:bg-espresso-800 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <span id="cart-badge" class="bg-orange-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden">0</span>
      </a>
    </div>
  </header>

  <!-- Menu Content -->
  <main class="max-w-6xl mx-auto px-4 py-4 pb-24">
    <div id="menu-container">
      <p class="text-center text-cream-400 py-20">Loading menu items...</p>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast">Added to cart</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/menu.js"></script>
</body>
</html>
