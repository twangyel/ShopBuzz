<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BuzzCafe — Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/menu.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0078AC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BuzzCafe">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            domBlue: '#0078AC',
            domBlueDark: '#005a82',
            domBlueLight: '#E6F2F8',
            domRed: '#D2112C',
            domRedDark: '#A50D22',
            domRedLight: '#FDE8EB',
            domDark: '#1A1A1A',
            domGray: '#6B7280',
            domGrayLight: '#F3F4F6',
            domLine: '#E5E7EB',
          }
        }
      }
    }
  </script>
  
<base target="_blank">
</head>
<body>

  <!-- Loader -->
  <div id="loader">
    <div class="loader-ring"></div>
    <div class="loader-word">Buzz<span>Cafe</span></div>
  </div>

  <!-- Sticky top -->
  <div class="topbar">
    <!-- Header -->
    <header id="main-header">
      <div class="nav-inner">
        <div class="flex items-center" style="gap:10px;">
          <a href="order.html" class="icon-btn" aria-label="Back to ordering">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
            </svg>
          </a>
          <div class="flex items-center" style="gap:10px;">
            <div class="brand-mark">
              <img src="image/logo.svg" alt="">
            </div>
            <div>
              <h1 class="brand-name" id="outlet-name">BuzzCafe</h1>
              <p class="brand-sub" id="outlet-info">Select outlet</p>
            </div>
          </div>
        </div>

        <div class="flex items-center" style="gap:8px;">
          <button id="auth-btn" class="icon-btn" title="Login">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </button>

          <a href="cart.html" class="cart-btn" aria-label="View cart">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
            <span id="cart-badge" class="hidden scale-0 transition-transform duration-300">0</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Search & Categories -->
    <div class="filterbar">
      <div class="filter-inner">
        <div class="search-wrap">
          <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search for dishes, combos & more..." class="search-box">
        </div>

        <div id="section-tabs" class="tab-row hide-scroll">
          <button class="section-tab active" data-section="all">All Menu</button>
        </div>

        <div id="category-pills" class="tab-row hide-scroll hidden">
          <!-- sub-categories injected here -->
        </div>
      </div>
    </div>
  </div>

      <h2 class="menu-title">Menu</h2>
      <div class="menu-rule"></div>

    <div id="menu-container">

      </div>
    </div>

    <div id="no-results" class="hidden text-center" style="padding:80px 0;">
      <div class="empty-icon">🔍</div>
      <p class="empty-title">No dishes found</p>
      <p class="empty-sub">Try a different search term or category</p>
    </div>`
  </main>

  <!-- Toast -->
  <div id="toast">
    <svg class="w-5 h-5" style="color:var(--dom-blue)" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
    </svg>
    <span id="toast-msg">Added to cart</span>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="fixed inset-0 z-[60] hidden flex items-end md:items-center justify-center">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeAuthModal()"></div>
    <div id="auth-sheet" class="auth-sheet relative w-full md:w-[420px] rounded-t-2xl md:rounded-2xl p-6 transform transition-transform duration-300 translate-y-full">
      <div class="auth-grabber md:hidden"></div>
      <h2 class="font-display" id="auth-title" style="font-size:22px;font-weight:800;color:var(--dom-dark);margin-bottom:4px;">Welcome</h2>
      <p style="font-size:14px;color:var(--dom-gray);margin-bottom:24px;font-weight:500;">Enter your phone to save details &amp; see orders.</p>
      <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="space-y-4">
          <div>
            <label class="field-label">Phone Number <span class="req">*</span></label>
            <div class="flex">
              <span class="field-prefix">+975</span>
              <input type="tel" id="auth-phone" required pattern="[0-9]{8}" maxlength="8" class="field field-joined" placeholder="17XXXXXX">
            </div>
            <p class="field-hint">8 digits, no country code</p>
          </div>
          <div id="name-field" class="hidden">
            <label class="field-label">Full Name <span class="req">*</span></label>
            <input type="text" id="auth-name" class="field" placeholder="Your name">
          </div>
          <div>
            <label class="field-label">Email <span style="color:var(--dom-gray);font-weight:500;">(optional)</span></label>
            <input type="email" id="auth-email" class="field" placeholder="For receipts (optional)">
          </div>
          <div>
            <label class="field-label">Password <span class="req">*</span></label>
            <input type="password" id="auth-password" required minlength="6" class="field" placeholder="Min 6 characters">
          </div>
        </div>
        <button type="submit" class="btn-primary" style="margin-top:24px;">
          <span id="auth-btn-text">Continue</span>
        </button>
      </form>
      <div style="margin-top:20px;text-align:center;">
        <p style="font-size:14px;color:var(--dom-gray);font-weight:500;">
          <span id="auth-toggle-label">New here?</span>
          <button onclick="toggleAuthMode()" id="auth-toggle-btn" style="color:var(--dom-blue);font-weight:700;margin-left:5px;">Create account</button>
        </p>
      </div>
      <button onclick="closeAuthModal()" class="modal-close" aria-label="Close">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/assets/js/menu.js"></script>

</html>
