<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;}</style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ea580c">
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-gray-400 hover:text-gray-600">←</a>
        <div>
          <h1 class="font-bold text-gray-900" id="outlet-name">Loading...</h1>
          <p class="text-xs text-gray-500">Our Menu</p>
        </div>
      </div>
      <a href="cart.html" class="relative bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition">
        Cart
        <span id="cart-count" class="absolute -top-2 -right-2 bg-orange-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold hidden">0</span>
      </a>
    </div>
  </header>

  <!-- Menu Content -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="menu-container">
      <p class="text-center text-gray-400 py-20">Loading menu...</p>
    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-4 right-4 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition duration-300 z-50 text-sm font-medium">
    Added to cart
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="assets/js/menu.js"></script>
</body>
</html>
