<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BuzzCafe — Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f59e0b">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#f59e0b',
            accentHover: '#d97706',
            dark: '#0f0f0f',
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #FFFBF7 0%, #FFF5EB 100%);
      background-attachment: fixed;
      color: #2A1B14;
      -webkit-font-smoothing: antialiased;
      line-height: 1.4;
    }

    #loader {
      position: fixed; inset: 0; z-index: 9999;
      background: #FFFBF7;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity .4s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }

    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    .cat-pill {
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 24px;
      border: 1.5px solid #ffedd5;
      background: #fff;
      color: #78716c;
      cursor: pointer;
      transition: all .25s cubic-bezier(.4,0,.2,1);
      user-select: none;
    }
    .cat-pill.active {
      background: #f59e0b;
      color: #fff;
      border-color: #f59e0b;
      box-shadow: 0 4px 14px rgba(245,158,11,.25);
    }
    .cat-pill:not(.active):hover {
      border-color: #f59e0b;
      color: #f59e0b;
      transform: translateY(-1px);
    }
    .cat-pill:active { transform: scale(.95); }

    .section-tab {
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 24px;
      border: 1.5px solid #ffedd5;
      background: #fff;
      color: #78716c;
      cursor: pointer;
      transition: all .25s cubic-bezier(.4,0,.2,1);
      user-select: none;
    }
    .section-tab.active {
      background: #f59e0b;
      color: #fff;
      border-color: #f59e0b;
      box-shadow: 0 4px 14px rgba(245,158,11,.25);
    }
    .section-tab:not(.active):hover {
      border-color: #f59e0b;
      color: #f59e0b;
      transform: translateY(-1px);
    }
    .section-tab:active { transform: scale(.95); }

    .menu-card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      transition: all .35s cubic-bezier(.4,0,.2,1);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .menu-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,.12);
    }
    .menu-card:active { transform: scale(.98); }

    .card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #f3f4f6;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s cubic-bezier(.4,0,.2,1);
    }
    .menu-card:hover .card-img-wrap img {
      transform: scale(1.08);
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .dish-name {
      font-size: 15px;
      font-weight: 700;
      color: #451a03;
      line-height: 1.25;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .dish-desc {
      font-size: 12px;
      color: #a8a29e;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
      min-height: 28px;
    }
    .dish-price {
      font-size: 16px;
      font-weight: 800;
      color: #ea580c;
      letter-spacing: -0.02em;
    }

    .btn-add {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 0;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #f59e0b;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .25s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 4px 12px rgba(245,158,11,.25);
    }
    .btn-add:hover {
      background: #d97706;
      color: #fff;
      box-shadow: 0 6px 20px rgba(245,158,11,.40);
      transform: translateY(-1px);
    }
    .btn-add:active {
      transform: scale(.95);
    }

    .stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 10px;
      overflow: hidden;
      background: #fff7ed;
      height: 36px;
    }
    .stepper button {
      width: 36px;
      height: 100%;
      border: none;
      background: transparent;
      font-size: 18px;
      font-weight: 700;
      color: #451a03;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
    }
    .stepper button:hover { background: #ffedd5; color: #d97706; }
    .stepper button:active { background: #fed7aa; }
    .stepper .qty {
      font-size: 14px;
      font-weight: 800;
      color: #451a03;
      min-width: 28px;
      text-align: center;
    }

    .search-box {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 1.5px solid #ffedd5;
      border-radius: 14px;
      background: #fff;
      font-size: 15px;
      color: #451a03;
      transition: all .25s;
      box-shadow: 0 2px 12px rgba(245,158,11,0.06);
    }
    .search-box:focus {
      outline: none;
      border-color: #f59e0b;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(245,158,11,.12), 0 4px 16px rgba(245,158,11,.08);
    }
    .search-box::placeholder { color: #d6d3d1; }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(140%);
      background: #451a03;
      color: #fff;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      transition: all .4s cubic-bezier(.34,1.56,.64,1);
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 16px 48px rgba(0,0,0,.25);
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .empty-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ffedd5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px;
    }

    .header-scrolled { box-shadow: 0 4px 20px rgba(245,158,11,.08) !important; }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 480px) {
      .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    }
    @media (min-width: 640px) {
      .menu-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }
    @media (min-width: 1024px) {
      .menu-grid { grid-template-columns: repeat(4, 1fr); gap: 18px; }
    }
    @media (min-width: 1280px) {
      .menu-grid { grid-template-columns: repeat(5, 1fr); gap: 20px; }
    }

    .nav-inner {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    @media (min-width: 768px) {
      .nav-inner { padding: 0 24px; }
    }

    /* Auth modal */
    #auth-modal .backdrop { transition: opacity .3s; }
    #auth-sheet { transition: transform .3s cubic-bezier(.4,0,.2,1); }
  </style>
</head>
<body>

  <!-- Loader -->
  <div id="loader">
    <div class="w-10 h-10 border-4 border-orange-200 border-t-orange-500 rounded-full animate-spin"></div>
  </div>

  <!-- Header -->
  <header id="main-header" class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-sm border-b border-orange-100 transition-shadow duration-300">
    <div class="nav-inner">
      <!-- Left: back + brand -->
      <div class="flex items-center gap-4">
        <a href="order.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-orange-50 transition">
          <svg class="w-5 h-5 text-gray-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </a>
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-accent rounded-xl flex items-center justify-center shadow-lg shadow-orange-500/20">
            <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-base font-bold text-gray-900 leading-tight tracking-tight" id="outlet-name">BuzzCafe</h1>
            <p class="text-[11px] text-gray-500 font-medium leading-tight" id="outlet-info">Select outlet</p>
          </div>
        </div>
      </div>

      <!-- Right: profile + cart -->
      <div class="flex items-center gap-3">
        <button id="auth-btn" class="relative w-11 h-11 flex items-center justify-center rounded-full bg-orange-500 text-white shadow-lg shadow-orange-500/30 hover:bg-orange-600 transition active:scale-95" title="Login">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </button>

        <a href="cart.html" class="relative w-11 h-11 flex items-center justify-center rounded-full bg-orange-500 text-white shadow-lg shadow-orange-500/30 hover:bg-orange-600 transition active:scale-95">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
          <span id="cart-badge" class="absolute -top-0.5 -right-0.5 w-5 h-5 bg-gray-900 text-white text-[10px] font-bold rounded-full flex items-center justify-center hidden shadow-md scale-0 transition-transform duration-300">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Search & Categories -->
  <div class="fixed top-16 left-0 right-0 z-40 bg-white/80 backdrop-blur-md border-b border-orange-100">
    <div class="w-full max-w-[1400px] mx-auto px-4 py-3 md:px-6">
      <div class="relative">
        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-orange-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search dishes, cuisines..." class="search-box">
      </div>
    </div>
    <div class="w-full max-w-[1400px] mx-auto px-4 md:px-6 pb-1">
      <div id="section-tabs" class="flex gap-2 overflow-x-auto hide-scroll pb-1">
        <button class="section-tab active" data-section="all">All</button>
      </div>
    </div>
    <div class="w-full max-w-[1400px] mx-auto px-4 md:px-6 pb-3">
      <div id="category-pills" class="flex gap-2 overflow-x-auto hide-scroll pb-1 hidden">
        <!-- sub-categories injected here -->
      </div>
    </div>
  </div>

  <!-- Menu -->
  <main class="w-full max-w-[1400px] mx-auto px-4 md:px-6 pt-[164px] pb-24">
    <div id="menu-container">
      <div class="menu-grid pt-6">
        <div class="menu-card animate-pulse"><div class="card-img-wrap bg-gray-200"></div><div class="card-body"><div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div><div class="h-3 bg-gray-200 rounded w-full mb-4"></div><div class="h-10 bg-gray-200 rounded-lg"></div></div></div>
        <div class="menu-card animate-pulse"><div class="card-img-wrap bg-gray-200"></div><div class="card-body"><div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div><div class="h-3 bg-gray-200 rounded w-full mb-4"></div><div class="h-10 bg-gray-200 rounded-lg"></div></div></div>
        <div class="menu-card animate-pulse"><div class="card-img-wrap bg-gray-200"></div><div class="card-body"><div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div><div class="h-3 bg-gray-200 rounded w-full mb-4"></div><div class="h-10 bg-gray-200 rounded-lg"></div></div></div>
        <div class="menu-card animate-pulse"><div class="card-img-wrap bg-gray-200"></div><div class="card-body"><div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div><div class="h-3 bg-gray-200 rounded w-full mb-4"></div><div class="h-10 bg-gray-200 rounded-lg"></div></div></div>
        <div class="menu-card animate-pulse"><div class="card-img-wrap bg-gray-200"></div><div class="card-body"><div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div><div class="h-3 bg-gray-200 rounded w-full mb-4"></div><div class="h-10 bg-gray-200 rounded-lg"></div></div></div>
        <div class="menu-card animate-pulse"><div class="card-img-wrap bg-gray-200"></div><div class="card-body"><div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div><div class="h-3 bg-gray-200 rounded w-full mb-4"></div><div class="h-10 bg-gray-200 rounded-lg"></div></div></div>
      </div>
    </div>
    
    <div id="no-results" class="hidden text-center py-24">
      <div class="empty-icon">🔍</div>
      <p class="text-lg font-bold text-gray-900">No dishes found</p>
      <p class="text-sm text-gray-500 mt-1">Try a different search term or category</p>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast">
    <svg class="w-5 h-5 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
    </svg>
    <span id="toast-msg">Added to cart</span>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="fixed inset-0 z-[60] hidden flex items-end md:items-center justify-center">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeAuthModal()"></div>
    <div id="auth-sheet" class="relative w-full md:w-[420px] bg-white rounded-t-2xl md:rounded-2xl p-6 shadow-2xl transform transition-transform duration-300 translate-y-full">
      <div class="w-12 h-1 bg-gray-200 rounded-full mx-auto mb-6 md:hidden"></div>
      <h2 class="text-xl font-bold text-gray-900 mb-1" id="auth-title">Welcome</h2>
      <p class="text-sm text-gray-500 mb-6">Enter your phone to save details & see orders.</p>
      <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number <span class="text-red-500">*</span></label>
            <div class="flex">
              <span class="inline-flex items-center px-3 rounded-l-xl border border-r-0 border-gray-200 bg-gray-50 text-gray-500 text-sm font-medium">+975</span>
              <input type="tel" id="auth-phone" required pattern="[0-9]{8}" maxlength="8" class="w-full px-4 py-3 rounded-r-xl border border-gray-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/10 outline-none transition" placeholder="17XXXXXX">
            </div>
            <p class="text-xs text-gray-400 mt-1">8 digits, no country code</p>
          </div>
          <div id="name-field" class="hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name <span class="text-red-500">*</span></label>
            <input type="text" id="auth-name" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/10 outline-none transition" placeholder="Your name">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email <span class="text-gray-400 font-normal">(optional)</span></label>
            <input type="email" id="auth-email" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/10 outline-none transition" placeholder="For receipts (optional)">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password <span class="text-red-500">*</span></label>
            <input type="password" id="auth-password" required minlength="6" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/10 outline-none transition" placeholder="Min 6 characters">
          </div>
        </div>
        <button type="submit" class="w-full mt-6 bg-orange-500 text-white font-bold py-3.5 rounded-xl hover:bg-orange-600 active:scale-[0.98] transition-all">
          <span id="auth-btn-text">Continue</span>
        </button>
      </form>
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-500">
          <span id="auth-toggle-label">New here?</span>
          <button onclick="toggleAuthMode()" class="text-orange-600 font-semibold underline ml-1" id="auth-toggle-btn">Create account</button>
        </p>
      </div>
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition">
        <svg class="w-5 h-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/assets/js/menu.js"></script>
</body>
</html>
