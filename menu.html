<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuzzCafe — Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/menu.css">
  <meta name="theme-color" content="#2A1B14">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: {
              50: '#FDFCF8',
              100: '#F7F1E8',
              200: '#E8DCCB',
              300: '#D4C4A8',
              400: '#C4A77D',
              500: '#B08968',
              600: '#8B7348',
              700: '#6B5235',
              800: '#4A3528',
              900: '#2A1B14'
            }
          }
        }
      }
    }
  </script>
  <base target="_blank">
<base target="_blank">
</head>
<body class="bg-cream-50 text-cream-900 antialiased selection:bg-cream-400 selection:text-cream-900">

  <!-- Loader -->
  <div id="loader">
    <div class="loader-logo w-20 h-20 rounded-full bg-cream-400 flex items-center justify-center text-white text-3xl animate-pulse">
      ☕
    </div>
    <div class="loader-bar mt-6"></div>
    <p class="loader-text mt-4">Loading Menu</p>
  </div>

  <!-- Header -->
  <header class="bg-white/90 backdrop-blur-xl border-b border-cream-200 sticky top-0 z-40 shadow-sm shadow-cream-200/50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <a href="index.html" class="w-9 h-9 rounded-xl bg-cream-100 flex items-center justify-center text-cream-600 hover:text-cream-900 hover:bg-cream-200 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </a>

        <div class="flex items-center gap-3">
          <!-- Logo Mark -->
          <div class="w-10 h-10 bg-cream-900 rounded-xl flex items-center justify-center shadow-lg shadow-cream-900/20 relative overflow-hidden">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-cream-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
              <line x1="6" y1="1" x2="6" y2="4"></line>
              <line x1="10" y1="1" x2="10" y2="4"></line>
              <line x1="14" y1="1" x2="14" y2="4"></line>
            </svg>
          </div>

          <div>
            <div class="flex items-baseline gap-2">
              <h1 class="font-display text-lg font-bold text-cream-900 leading-none tracking-wide" id="outlet-name">BuzzCafe</h1>
              <span class="hidden sm:inline-block w-1 h-1 rounded-full bg-cream-400"></span>
              <span class="hidden sm:inline-block text-[10px] text-cream-500 uppercase tracking-widest font-medium">Menu</span>
            </div>
            <select id="outlet-switcher" class="text-[11px] text-cream-600 bg-cream-50 border border-cream-200 rounded-lg px-2 py-1 mt-1 focus:outline-none focus:border-cream-400 focus:ring-1 focus:ring-cream-400/30 cursor-pointer transition">
              <option value="">Loading outlets...</option>
            </select>
          </div>
        </div>
      </div>

      <a href="cart.html" class="relative bg-cream-900 text-cream-50 px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 hover:bg-cream-800 active:scale-95 transition shadow-lg shadow-cream-900/15">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <span class="hidden sm:inline">Cart</span>
        <span id="cart-badge" class="bg-cream-400 text-cream-900 text-[10px] min-w-[1.25rem] h-5 rounded-full flex items-center justify-center font-bold hidden shadow-sm">0</span>
      </a>
    </div>

    <!-- Search Bar -->
    <div class="border-t border-cream-100 px-4 py-3 bg-cream-50/80 backdrop-blur-sm">
      <div class="max-w-6xl mx-auto relative">
        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3.5 top-1/2 -translate-y-1/2 h-4 w-4 text-cream-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="search-input" placeholder="Search our menu..." 
          class="w-full bg-white border border-cream-200 rounded-xl pl-10 pr-4 py-2.5 text-sm text-cream-900 placeholder-cream-400 focus:outline-none focus:border-cream-400 focus:ring-2 focus:ring-cream-400/20 transition">
      </div>
    </div>
  </header>

  <!-- Menu Content -->
  <main class="max-w-6xl mx-auto px-4 py-6 pb-28">
    <div id="menu-container">
      <div class="flex flex-col items-center justify-center py-24 gap-4">
        <div class="w-12 h-12 rounded-full border-2 border-cream-200 border-t-cream-400 animate-spin"></div>
        <p class="text-cream-500 text-sm tracking-wide">Loading menu items...</p>
      </div>
    </div>
    <div id="no-results" class="hidden text-center py-24">
      <div class="w-16 h-16 rounded-2xl bg-cream-100 border border-cream-200 flex items-center justify-center mx-auto mb-4 text-2xl">🔍</div>
      <p class="text-cream-700 text-lg font-medium">No items match your search.</p>
      <p class="text-sm text-cream-500 mt-2">Try a different keyword or browse by category.</p>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast">Added to cart</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/menu.js"></script>
</body>
</html>
